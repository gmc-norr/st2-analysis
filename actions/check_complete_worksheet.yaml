---
name: check_complete_worksheet
pack: gmc_norr_analysis
description: Workflow to check if all samples of the worksheet with
  the TestProfile have been analysed
runner_type: orquesta
entry_point: workflows/check_complete_worksheet.yaml
enabled: true

parameters:
  pipeline:
    description: The pipeline that the samples were analysed with
      without organisation (i.e, raredisease for nf-core/raredisease)
    type: string
    required: true
  failed_samples:
    description: The samples that completed the analysis
    type: array
    items:
      type: string
  completed_samples:
    description: The samples that failed
    type: array
    items:
      type: string
