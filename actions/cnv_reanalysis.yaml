---
name: cnv_reanalysis
pack: gmc_norr_analysis
description: Workflow to rerun raredisease samples to add CNVs.
runner_type: orquesta
entry_point: workflows/cnv_reanalysis.yaml
enabled: true

parameters:
  sample_id:
    description: The ID of seq sample to analyse
    type: string
  dna_sample_id:
    description: The ID of the corresponding DNA sample
    type: string
    required: true
  temp_location:
    description: Place to copy fastq files if they no longer are on seqdata
    type: string
    default: /storage/userdata/cnv-reruns
  plumber_env:
    type: object
    secret: true
    required: true
    default:
      PLUMBER_WEBHOOK_URL: "{{st2kv.system.api_url}}/webhooks/plumber"
      PLUMBER_WEBHOOK_API_KEY: "St2-Api-Key={{ st2kv.system.plumber_api_key | decrypt_kv }}"
  plumber_host:
    description: Host to run plumber on
    type: string
    default: "{{config_context.plumber.host}}"
