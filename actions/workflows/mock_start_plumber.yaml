version: "1.0"

description: Run downstream analysis of a sample with plumber.
input:
  - sample_id
  - case_id
  - run_id
  - pipeline
  - analysis_id
  - output_dir

tasks:
  
  mock_output_files:
    action: gmc_norr_analysis.mock_output_files
    input:
      pipeline: <% ctx().pipeline %>
      workdir: <%ctx().output_dir %>
      sample_id: <% ctx().sample_id %>
      case_id: <% ctx().case_id %>
    next:
      - when: <% succeeded() %>
        publish:
          - output_files: <% result().output_files %>
        do:
          - touch_files

  touch_files:
    with:
      items: file in <% ctx().output_files %>
    action: core.local
    input:
      cmd: "mkdir -p $(dirname <% item(file) %>) && touch <% item(file) %>"
