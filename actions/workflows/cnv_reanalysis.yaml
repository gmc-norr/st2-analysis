version: "1.0"

description: Rerun raredisease samples to add CNVs.

input:
  - dna_sample_id
  - sample_id
  - plumber_host
  - plumber_env

vars:
  - output_dir:
  - pipeline:
  - pipeline_version:
  - pipeline_profile:
  - plumber_config_version:
  - plumber_additional_arguments:
  - original_case_id:
  - case_id:
  - fastq_files:
  - analysis_id:
  - plumber_analysis_id:
  - input_files:
  - pid:

tasks:
  get_plumber_arguments:
    action: gmc_norr_analysis.get_plumber_arguments
    input:
       test_profile: WGSRareDiseaseCNV_2
    next:
      - when: "{{ succeeded() }}"
        publish:
          - pipeline: <% result().result.Pipeline %>
          - pipeline_version: <% result().result.Version %>
          - pipeline_profile: <% result().result.Profile %>
          - plumber_config_version: <% result().result.ConfigVersion %>
          - plumber_additional_arguments: "{{ result().result.get('AdditionalArguments', '') }}"
        do:
          get_case_id

  get_case_id:
    action: scout.view_case
    input:
      display_name: <% ctx().dna_sample_id %>
    next:
      - when: "{{ succeeded() }}"
        publish:
          - original_case_id: <% result().values().first().stdout.split('\n')[1].split('\t')[0].norm() %>
          - case_id: <% ctx().original_case_id + "_CNV" %>
        do:
          get_run_id

  get_run_id:
    action: scout.export_case
    input:
      case_id: <% ctx().original_case_id %>
    next:
      - when: "{{ succeeded() }}"
        publish:
          - run_id: <% result().values().first().stdout.first().multiqc.split('novaseq/')[1].split('/raredisease')[0] %>
        do:
          get_run_path

  get_run_path:
    action: cleve.get_runs
    input:
      run_id: <% ctx().run_id %>
    next:
      - when: "{{ succeeded() }}"
        publish:
          - run_path: "{{ result().get('result').get('body').get('runs') | map(attribute='path') | first }}"
        do:
          get_analysis_id

  get_analysis_id:
    action: cleve.get_analyses
    input:
      run_id: <% ctx().run_id %>
      software: "Dragen BCLConvert"
    next:
      - when: "{{ succeeded() }}"
        publish:
          - analysis_id: "{{ result().get('result').get('body').get('analyses') | map(attribute='analysis_id') | first }}"
        do:
          get_fastq_files

  get_fastq_files:
    action: cleve.get_analysis_files
    input:
      analysis_id: <% ctx().analysis_id %>
      type: "fastq"
    next:
      - when: "{{ succeeded() }}"
        publish:
          - fastq_files:
              <% ctx().sample_id %>:
                R1: <% result().result.body.where($.path.matches(ctx().sample_id or ctx().dna_sample_id)).where($.path.matches("_R1_")).select($.path).orderBy($) %>
                R2: <% result().result.body.where($.path.matches(ctx().sample_id or ctx().dna_sample_id)).where($.path.matches("_R2_")).select($.path).orderBy($) %>
        do:
          check_file_location

  check_file_location:
    action: core.local
    input:
      cmd: "[[ -f {{ ctx().fastq_files.get(ctx().sample_id).R1[0] }} ]]"
    next:
      - when: "{{ succeeded() and ctx().run_path.startswith('/seqdata/') and ctx().fastq_files.get(ctx().sample_id).R1[0].startswith('/seqdata/') }}"
        publish:
          - output_dir: "{{ ctx().run_path.rstrip('/') }}/{{ ctx().pipeline.split('/')[-1] }}_CNV/{{ ctx().sample_id }}"
        do:
          get_sample_data
      - when: "{{ failed() }}"
        publish:
          - output_dir: "/storage/userdata/cnv-reruns/{{ ctx().pipeline.split('/')[-1] }}_CNV/{{ ctx().sample_id }}"
        do:
          make_temp_location

  make_temp_location:
    action: core.local
    input:
      cmd: mkdir -p <% ctx().output_dir%>/fastq
    next:
      - when: "{{ succeeded() }}"
        do:
          copy_fastq

  copy_fastq:
    action: core.local
    with: fastq_file in <% ctx().fastq_files.get(ctx().sample_id).R1 + ctx().fastq_files.get(ctx().sample_id).R2 %>
    input:
      cmd: 'rsync -a /scale<% item(fastq_file) %> <% ctx().output_dir %>/fastq'
    next:
      - when: "{{ succeeded() }}"
        do:
          format_new_fastq_files

  format_new_fastq_files:
    action: core.noop
    next:
      - when: "{{ succeeded() }}"
        publish:
          - fastq_files:
              <% ctx().sample_id %>:
                R1: "{% for file in ctx().fastq_files.get(ctx().sample_id).R1 %}{{ ctx(output_dir)/fastq/file.split('/')[-1] }}{% endfor %}"
                R2: "{% for file in ctx().fastq_files.get(ctx().sample_id).R2 %}{{ ctx(output_dir)/fastq/file.split('/')[-1] }}{% endfor %}"
        do:
          get_sample_data

  get_sample_data:
    action: igene.get_sample
    input:
      sample_id: <% ctx().sample_id %>
    next:
      - when: "{{ succeeded() }}"
        publish:
          - sex: <% result().result.body.Sex %>
        do:
          raredisease_workflow

  raredisease_workflow:
    action: gmc_norr_analysis.prepare_raredisease
    input:
      sample_id: <% ctx().sample_id %>
      run_id: <% ctx().run_id %>
      case_id: <% ctx().case_id %>
      sex: <% ctx().sex %>
      fastq_files: <% ctx().fastq_files %>
      output_dir: <% ctx().output_dir %>
    next:
      - when: "{{ succeeded() }}"
        do:
          mark_rerun

  mark_rerun:
    action: core.local
    input:
      cmd: "echo 'CNV' > {{ ctx().output_dir }}/RERUN"
    next:
      - when: "{{ succeeded() }}"
        do:
          format_cleve_input_files

  format_cleve_input_files:
    action: gmc_norr_analysis.get_pipeline_input_files
    input:
      pipeline: <% ctx().pipeline %>
      sample_id: <% ctx().sample_id %>
      fastq_files: <% ctx().fastq_files %>
      analysis_ids:
        "{{ ctx().sample_id }}": "{{ ctx().analysis_id }}"
    next:
      - when: "{{ succeeded() }}"
        publish:
          input_files="{{ result().result }}"
        do:
          add_plumber_analysis_to_cleve

  add_plumber_analysis_to_cleve:
    action: cleve.add_analysis
    input:
      run_id: <% ctx().run_id %>
      state: pending
      path: <% ctx().output_dir %>
      software: <% ctx().pipeline %>
      software_version: <% ctx().pipeline_version %>
      input_files: <% ctx().input_files %>
    next:
      - when: "{{ succeeded() }}"
        publish:
          - plumber_analysis_id: <% result().result.body.analysis_id %>
        do:
          start_plumber

  start_plumber:
    action: core.remote
    input:
      cmd: "nohup plumber run <% ctx().pipeline %>
        --version <% ctx().pipeline_version %> --config-version <% ctx().plumber_config_version %>
        -p <% ctx().pipeline_profile %> --analysis-id <% ctx().plumber_analysis_id %> <% ctx().plumber_additional_arguments %> &> plumber.log & echo $!"
      cwd: <% ctx().output_dir %>
      hosts: <% ctx().plumber_host %>
      env: <% ctx().plumber_env %>
    next:
      - when: "{{ succeeded() }}"
        publish:
          - pid: "{{ result().get((result().keys() | list | first)).get('stdout') }}"
        do: check_progress

  check_progress:
    action: core.remote
    delay: 30
    input:
      cmd: "ps --no-headers --pid <% ctx().pid %>"
      cwd: <% ctx().output_dir %>
      hosts: <% ctx().plumber_host %>
