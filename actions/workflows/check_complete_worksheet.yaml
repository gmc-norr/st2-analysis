version: "1.0"

description: Check finished finished samples against logged samples from plumber

input:
  - pipeline
  - sample_id
  - run_id
  - base_log_dir

vars:
  - log_dir:
  - n_complete:
  - n_total:
  - n_failed:

tasks:
  make_log_dir:
    action: coe.noop
    next:
      - when: "{{ succeeded() }}"
        publish: # TODO: How to get the run_id, i.e. ctx().workdir.split('/')[-3] ? Needs to match the log action at least
          - log_dir: "{{ ctx().base_log_dir }}/{{ run_id() }}/{{ ctx().pipeline.split('/')[-1]}}"
        do:
          complete_sample_log

  complete_sample_log:
    action: core.local
    input:
      cmd: "mv {{ ctx().log_dir }}/{{ ctx().sample_id }} {{ ctx().log_dir }}/{{ ctx().sample_id }}.complete"
    next:
      - when: "{{ succeeded() }}"
        do:
          count_complete
      - when: "{{ failed() }}"
        do:
          report_failure

  count_complete:
    action: core.local
    input:
      cmd: "ls {{ ctx().log_dir }}/*.complete | wc -l"
    next:
      - when: "{{ succeeded() }}"
        publish:
          - n_complete: "{{ result().stdout() }}"
        do:
          count_all
      - when: "{{ failed() }}"
        do:
          report_failure

  count_all:
    action: core.local
    input:
      cmd: "ls {{ ctx().log_dir }}/  | wc -l"
    next:
      - when: "{{ succeeded() and result().stdout() == ctx().n_complete }}"
        do:
          report_success
      - when: "{{ succeeded() and result().stdout() != ctx().n_complete }}"
        publish:
          - n_all:  "{{ result().stdout() }}"
        do:
          check_incomplete
      - when: "{{ failed() }}"
        do:
          report_failure

  check_incomplete:
    action: core.local
    input:
      cmd: "grep -lr 'false' {{ ctx().log_dir }}/ | wc -l"
    next:
      - when: "{{ succeeded() and ctx().n_all == result().stdout() + ctx().n_complete }}"
        publish:
          - n_failed: " {{ result().stdout() }}"
        do:
          report_success
      - when: "{{ succeeded() and ctx().n_all != result().stdout() + ctx().n_complete }}"
        do: # this just means the others are still ongoing
          noop
      - when: "{{ failed() }}"
        do:
          report_failure

  report_failure:
    action: core.inject_trigger
    input:
      trigger_name: gmc_norr_analysis.email_notification
      payload:
        subject: "Failed to check if all samples are done"
        message: "{{ ctx().sample_id }} was successfully loaded into Scout
          but the check if the rest of the samples were also done failed.
          Check for problems in the log directory {{ ctx().log_dir }}"
    next:
      do: fail

  report_success:
    action: core.inject_trigger
    input: # should maybe go to another email?
      trigger_name: gmc_norr_analysis.email_notification
      payload: # Would be nicer to also list the samples, at least the failed ones
        subject: "{{ ctx().pipeline }} analyses done"
        message: "{{ ctx().n_complete }} successful samples
                 \n{{ ctx().n_failed }} failed samples"
